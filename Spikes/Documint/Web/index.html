<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; worker-src blob:; base-uri 'none'; form-action 'none'">
  <title>GistPad Documint spike</title>
  <style>
    html, body, #root { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #root { display: flex; flex-direction: column; }
    .surface { min-height: 0; flex: 1; }
    .error { margin: 0; padding: 12px 20px; color: CanvasText; background: Canvas; }
    .documint, [data-documint-overlay-root] { --documint-leaf-font-family: -apple-system, BlinkMacSystemFont, sans-serif !important; }
  </style>
  <script type="module" src="./editor.js"></script>
</head>
<body><div id="root"></div></body>
</html>
